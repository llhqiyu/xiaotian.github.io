<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>爱心弹窗表白</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;overflow:hidden}
.box{
  position:absolute;
  width:150px;height:60px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;font-size:14px;
}
</style>
</head>
<body>
<script>
const textArr = ["多喝水利","好好爱自己","好好吃饭","保持好心情","我想你了","顺顺利利","别熬夜","天凉了多穿衣服"]
const colorArr = ["pink","#add8e6","#90ee90","#fffacd","hotpink","skyblue"]
let domList = []
const w = document.documentElement.clientWidth
const h = document.documentElement.clientHeight

//爱心点位生成
function getPoint(num,sw,sh){
  let arr=[]
  for(let i=0;i<num;i++){
    let th = i/num*2*Math.PI
    let x = 16*Math.sin(th)**3
    let y = 13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th)
    let px = sw/2 + x*20 -75
    let py = sh/2 - y*20 -30
    px=Math.max(0,Math.min(px,sw-150))
    py=Math.max(0,Math.min(py,sh-60))
    arr.push([px,py])
  }
  return arr
}

//创建弹窗
function createBox(left,top,txt){
  let div = document.createElement('div')
  div.className='box'
  div.style.left=left+'px'
  div.style.top=top+'px'
  div.style.background=colorArr[Math.floor(Math.random()*colorArr.length)]
  div.innerText=txt||textArr[Math.floor(Math.random()*textArr.length)]
  document.body.appendChild(div)
  domList.push(div)
  return div
}

(async function run(){
  //拼成爱心
  let heartPoints = getPoint(100,w,h)
  for(let i=0;i<heartPoints.length;i++){
    let [x,y]=heartPoints[i]
    createBox(x,y,i==99?"充实自己":null)
    await sleep(30)
  }
  await sleep(1000)
  //清空爱心框
  domList.forEach(d=>d.remove())
  domList=[]
  //全屏随机弹窗
  let max = Math.floor(w/150)*Math.floor(h/60)+50
  for(let i=0;i<max;i++){
    let rx=Math.floor(Math.random()*(w-150))
    let ry=Math.floor(Math.random()*(h-60))
    createBox(rx,ry)
    await sleep(5)
  }
  //停留10秒后全部消失
  await sleep(10000)
  domList.forEach(d=>d.remove())
})()

function sleep(t){
  return new Promise(res=>setTimeout(res,t))
}
</script>
</body>
</html>
